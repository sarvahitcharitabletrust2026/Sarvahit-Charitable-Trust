<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<title>Reset Password | Sarvahit Charitable Trust</title>
<script>
  const incoming = new URL(window.location.href);
  const portal = new URL("admin.html", incoming);
  portal.searchParams.set("reset", "1");
  if (incoming.searchParams.has("error")) portal.searchParams.set("error", "recovery");
  portal.hash = incoming.hash;
  window.location.replace(portal.href);
</script>
<noscript><p>Enable JavaScript to open the password reset form.</p><a href="admin.html">Back to Trust Portal Login</a></noscript>
</html>
